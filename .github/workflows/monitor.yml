name: Monitor Doctolib slot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctolib-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Restore monitor state
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: doctolib-state-${{ github.run_id }}
          restore-keys: |
            doctolib-state-

      - name: Run monitor
        id: monitor
        env:
          DOCTOLIB_COOKIE: ${{ secrets.DOCTOLIB_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          python3 monitor.py --state-file .state/state.json

      - name: Save monitor state when changed
        if: steps.monitor.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .state
          key: doctolib-state-${{ github.run_id }}
