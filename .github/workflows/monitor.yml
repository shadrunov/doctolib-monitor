name: Monitor Doctolib slot

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send a silent Telegram delivery test instead of checking Doctolib
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [doctolib_check]

permissions:
  contents: read

concurrency:
  group: doctolib-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Restore monitor state
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: doctolib-state-${{ github.run_id }}
          restore-keys: |
            doctolib-state-

      - name: Run monitor
        id: monitor
        if: github.event_name != 'workflow_dispatch' || inputs.telegram_test != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          FAILURE_THRESHOLD: "10"
          REQUEST_ATTEMPTS: "3"
        run: |
          python3 monitor.py --state-file .state/state.json

      - name: Test Telegram delivery
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_test == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          REQUEST_ATTEMPTS: "3"
        run: |
          python3 - <<'PY'
          import os
          from monitor import send_telegram, telegram_chat_ids

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          for chat_id in telegram_chat_ids():
              send_telegram(
                  token,
                  chat_id,
                  "✅ Doctolib monitor GitHub delivery test succeeded.",
                  silent=True,
              )
          PY

      - name: Save monitor state when changed
        if: steps.monitor.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .state
          key: doctolib-state-${{ github.run_id }}
