name: Monitor Doctolib slot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [doctolib_alert]

permissions:
  contents: read

concurrency:
  group: doctolib-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Restore monitor state
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: doctolib-state-${{ github.run_id }}
          restore-keys: |
            doctolib-state-

      - name: Run monitor
        id: monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          python3 monitor.py --state-file .state/state.json

      - name: Save monitor state when changed
        if: steps.monitor.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .state
          key: doctolib-state-${{ github.run_id }}

  telegram-relay:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send alert to every configured Telegram chat
        env:
          ALERT_MESSAGE: ${{ github.event.client_payload.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          message = os.environ["ALERT_MESSAGE"]
          chat_ids = [item.strip() for item in os.environ["TELEGRAM_CHAT_IDS"].split(",") if item.strip()]
          for chat_id in chat_ids:
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if not payload.get("ok"):
                  raise RuntimeError(f"Telegram rejected message for chat {chat_id}")
          PY
